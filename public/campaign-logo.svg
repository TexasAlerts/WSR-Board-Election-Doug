<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="navyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B3A5D"/>
      <stop offset="100%" stop-color="#0F2840"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#BF1E2E"/>
      <stop offset="100%" stop-color="#9F1020"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8F0F8"/>
      <stop offset="100%" stop-color="#D4E4F2"/>
    </linearGradient>
    <linearGradient id="towerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8BA8C4"/>
      <stop offset="100%" stop-color="#6B8BAA"/>
    </linearGradient>
    <linearGradient id="buildingGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C45A3A"/>
      <stop offset="100%" stop-color="#A84830"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B3A5D"/>
      <stop offset="100%" stop-color="#2B4A6D"/>
    </linearGradient>
    <clipPath id="texasClip">
      <path d="M560,90 L590,88 L610,95 L620,90 L635,92 L640,100 L650,105 L660,100 L665,108 L660,120 L665,135 L660,150 L670,160 L680,175 L675,190 L665,200 L660,215 L650,225 L640,220 L630,230 L615,240 L600,235 L590,240 L575,235 L565,230 L560,220 L555,210 L550,200 L545,190 L540,180 L535,165 L538,150 L540,135 L545,120 L550,105 Z"/>
    </clipPath>
    <linearGradient id="texasRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BF1E2E"/>
      <stop offset="50%" stop-color="#BF1E2E"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <!-- ====== BACKGROUND SCENE ====== -->

  <!-- Trees (background, behind buildings) -->
  <g opacity="0.9">
    <!-- Left tree cluster -->
    <ellipse cx="130" cy="230" rx="45" ry="40" fill="#2D7A3A"/>
    <ellipse cx="170" cy="225" rx="40" ry="35" fill="#358442"/>
    <ellipse cx="100" cy="235" rx="35" ry="30" fill="#247032"/>
    <!-- Right tree cluster -->
    <ellipse cx="620" cy="230" rx="40" ry="35" fill="#2D7A3A"/>
    <ellipse cx="660" cy="225" rx="45" ry="40" fill="#358442"/>
    <ellipse cx="690" cy="235" rx="35" ry="30" fill="#247032"/>
    <!-- Center trees -->
    <ellipse cx="350" cy="225" rx="30" ry="25" fill="#2D7A3A"/>
    <ellipse cx="450" cy="225" rx="30" ry="25" fill="#358442"/>
    <ellipse cx="500" cy="230" rx="25" ry="22" fill="#247032"/>
  </g>

  <!-- ====== WINDMILL (Left) ====== -->
  <g>
    <!-- Tower/pole -->
    <rect x="192" y="100" width="6" height="165" fill="#6B8BAA"/>
    <!-- Cross braces -->
    <line x1="192" y1="140" x2="198" y2="180" stroke="#5A7A94" stroke-width="1.5"/>
    <line x1="198" y1="140" x2="192" y2="180" stroke="#5A7A94" stroke-width="1.5"/>
    <line x1="192" y1="180" x2="198" y2="220" stroke="#5A7A94" stroke-width="1.5"/>
    <line x1="198" y1="180" x2="192" y2="220" stroke="#5A7A94" stroke-width="1.5"/>
    <!-- Base struts -->
    <line x1="195" y1="265" x2="175" y2="265" stroke="#6B8BAA" stroke-width="3"/>
    <line x1="195" y1="265" x2="215" y2="265" stroke="#6B8BAA" stroke-width="3"/>
    <!-- Fan hub -->
    <circle cx="195" cy="95" r="8" fill="#5A7A94"/>
    <circle cx="195" cy="95" r="4" fill="#4A6A84"/>
    <!-- Fan blades -->
    <g transform="rotate(15, 195, 95)">
      <polygon points="195,95 185,45 190,45 195,85" fill="#7A9AB4" opacity="0.9"/>
      <polygon points="195,95 205,45 200,45 195,85" fill="#6B8BAA" opacity="0.9"/>
      <polygon points="195,95 240,110 237,115 195,100" fill="#7A9AB4" opacity="0.9"/>
      <polygon points="195,95 240,85 237,80 195,90" fill="#6B8BAA" opacity="0.9"/>
      <polygon points="195,95 150,110 153,115 195,100" fill="#7A9AB4" opacity="0.9"/>
      <polygon points="195,95 150,85 153,80 195,90" fill="#6B8BAA" opacity="0.9"/>
      <polygon points="195,95 185,145 190,145 195,105" fill="#7A9AB4" opacity="0.9"/>
      <polygon points="195,95 205,145 200,145 195,105" fill="#6B8BAA" opacity="0.9"/>
    </g>
    <!-- Tail vane -->
    <line x1="195" y1="95" x2="225" y2="85" stroke="#5A7A94" stroke-width="2"/>
    <polygon points="225,75 225,95 240,85" fill="#6B8BAA" opacity="0.7"/>
  </g>

  <!-- ====== WATER TOWER (Center-Left) ====== -->
  <g>
    <!-- Legs -->
    <line x1="280" y1="240" x2="300" y2="170" stroke="#6B8BAA" stroke-width="4"/>
    <line x1="370" y1="240" x2="350" y2="170" stroke="#6B8BAA" stroke-width="4"/>
    <line x1="310" y1="240" x2="315" y2="170" stroke="#6B8BAA" stroke-width="3"/>
    <line x1="340" y1="240" x2="335" y2="170" stroke="#6B8BAA" stroke-width="3"/>
    <!-- Cross braces -->
    <line x1="288" y1="210" x2="345" y2="195" stroke="#5A7A94" stroke-width="1.5"/>
    <line x1="305" y1="210" x2="362" y2="195" stroke="#5A7A94" stroke-width="1.5"/>
    <!-- Tank body -->
    <ellipse cx="325" cy="135" rx="50" ry="38" fill="url(#towerGrad)"/>
    <!-- Tank top rim -->
    <ellipse cx="325" cy="110" rx="35" ry="8" fill="#8BA8C4"/>
    <!-- Cap/roof -->
    <path d="M290,110 L325,85 L360,110" fill="#7A9AB4"/>
    <circle cx="325" cy="82" r="4" fill="#5A7A94"/>
    <!-- Tank highlight -->
    <ellipse cx="315" cy="130" rx="20" ry="25" fill="white" opacity="0.1"/>
    <!-- Decorative band -->
    <rect x="278" y="130" width="94" height="4" rx="2" fill="#5A7A94" opacity="0.5"/>
  </g>

  <!-- ====== TOWN HALL (Center) ====== -->
  <g>
    <!-- Main building body -->
    <rect x="370" y="160" width="160" height="105" rx="2" fill="url(#buildingGrad)"/>
    <!-- Brick texture lines -->
    <g stroke="#A04828" stroke-width="0.5" opacity="0.3">
      <line x1="370" y1="175" x2="530" y2="175"/>
      <line x1="370" y1="190" x2="530" y2="190"/>
      <line x1="370" y1="205" x2="530" y2="205"/>
      <line x1="370" y1="220" x2="530" y2="220"/>
      <line x1="370" y1="235" x2="530" y2="235"/>
      <line x1="370" y1="250" x2="530" y2="250"/>
    </g>
    <!-- Roof -->
    <rect x="365" y="155" width="170" height="10" rx="2" fill="url(#roofGrad)"/>
    <!-- Central tower/cupola -->
    <rect x="430" y="110" width="40" height="50" fill="url(#buildingGrad)"/>
    <rect x="425" y="105" width="50" height="8" rx="2" fill="url(#roofGrad)"/>
    <!-- Cupola roof -->
    <path d="M425,105 L450,80 L475,105" fill="#1B3A5D"/>
    <!-- Clock/circle on cupola -->
    <circle cx="450" cy="128" r="10" fill="#F5F0E0" stroke="#1B3A5D" stroke-width="1.5"/>
    <line x1="450" y1="122" x2="450" y2="128" stroke="#1B3A5D" stroke-width="1"/>
    <line x1="450" y1="128" x2="455" y2="130" stroke="#1B3A5D" stroke-width="1"/>
    <!-- Main entrance arch -->
    <rect x="435" y="220" width="30" height="45" rx="15 15 0 0" fill="#1B3A5D" opacity="0.8"/>
    <rect x="439" y="224" width="22" height="41" rx="11 11 0 0" fill="#2B4A6D" opacity="0.6"/>
    <!-- Windows row 1 -->
    <rect x="385" y="170" width="18" height="25" rx="9 9 0 0" fill="#D4E4F2" stroke="#1B3A5D" stroke-width="1"/>
    <rect x="415" y="170" width="18" height="25" rx="9 9 0 0" fill="#D4E4F2" stroke="#1B3A5D" stroke-width="1"/>
    <rect x="467" y="170" width="18" height="25" rx="9 9 0 0" fill="#D4E4F2" stroke="#1B3A5D" stroke-width="1"/>
    <rect x="497" y="170" width="18" height="25" rx="9 9 0 0" fill="#D4E4F2" stroke="#1B3A5D" stroke-width="1"/>
    <!-- Windows row 2 -->
    <rect x="385" y="220" width="18" height="25" rx="2" fill="#D4E4F2" stroke="#1B3A5D" stroke-width="1"/>
    <rect x="497" y="220" width="18" height="25" rx="2" fill="#D4E4F2" stroke="#1B3A5D" stroke-width="1"/>
    <!-- Steps -->
    <rect x="425" y="260" width="50" height="5" rx="1" fill="#9A7A6A"/>
    <rect x="420" y="263" width="60" height="5" rx="1" fill="#8A6A5A"/>
  </g>

  <!-- ====== TEXAS STATE OUTLINE (Right) ====== -->
  <g>
    <!-- Texas shape filled with flag colors -->
    <g clip-path="url(#texasClip)">
      <!-- Blue section (top-left third) -->
      <rect x="535" y="85" width="50" height="160" fill="#1B3A5D"/>
      <!-- White stripe -->
      <rect x="585" y="85" width="100" height="80" fill="#FFFFFF"/>
      <!-- Red stripe -->
      <rect x="585" y="165" width="100" height="80" fill="#BF1E2E"/>
      <!-- Lone Star -->
      <polygon points="560,130 564,142 577,142 567,150 570,163 560,155 550,163 553,150 543,142 556,142" fill="white"/>
    </g>
    <!-- Texas outline stroke -->
    <path d="M560,90 L590,88 L610,95 L620,90 L635,92 L640,100 L650,105 L660,100 L665,108 L660,120 L665,135 L660,150 L670,160 L680,175 L675,190 L665,200 L660,215 L650,225 L640,220 L630,230 L615,240 L600,235 L590,240 L575,235 L565,230 L560,220 L555,210 L550,200 L545,190 L540,180 L535,165 L538,150 L540,135 L545,120 L550,105 Z" fill="none" stroke="#1B3A5D" stroke-width="2.5"/>
  </g>

  <!-- ====== FOREGROUND TREES (partial, in front of buildings at edges) ====== -->
  <g opacity="0.85">
    <ellipse cx="140" cy="245" rx="35" ry="28" fill="#247032"/>
    <ellipse cx="680" cy="245" rx="35" ry="28" fill="#247032"/>
  </g>

  <!-- ====== BANNER: "FOR TOWN COUNCIL - PLACE 5" ====== -->
  <g>
    <!-- Navy swoosh banner top -->
    <path d="M100,275 Q400,260 700,275 L700,305 Q400,290 100,305 Z" fill="url(#navyGrad)"/>
    <!-- White stars left -->
    <polygon points="140,290 142,285 144,290 149,290 145,293 146,298 142,295 138,298 139,293 135,290" fill="white" opacity="0.8"/>
    <!-- White stars right -->
    <polygon points="656,290 658,285 660,290 665,290 661,293 662,298 658,295 654,298 655,293 651,290" fill="white" opacity="0.8"/>
    <text x="400" y="296" text-anchor="middle" font-family="'Oswald', 'Arial Narrow', sans-serif" font-size="22" font-weight="700" fill="white" letter-spacing="3">FOR TOWN COUNCIL – PLACE 5</text>
  </g>

  <!-- ====== MAIN NAME: "DOUG CHARLES" ====== -->
  <g>
    <!-- DOUG in navy -->
    <text x="310" y="365" text-anchor="end" font-family="'Oswald', 'Arial Narrow', sans-serif" font-size="80" font-weight="700" fill="#1B3A5D" letter-spacing="4">DOUG</text>
    <!-- CHARLES in red -->
    <text x="320" y="365" text-anchor="start" font-family="'Oswald', 'Arial Narrow', sans-serif" font-size="80" font-weight="700" fill="#BF1E2E" letter-spacing="4">CHARLES</text>
    <!-- Decorative lines around name -->
    <line x1="100" y1="310" x2="100" y2="375" stroke="#1B3A5D" stroke-width="3"/>
    <line x1="700" y1="310" x2="700" y2="375" stroke="#BF1E2E" stroke-width="3"/>
  </g>

  <!-- ====== RED BANNER BOTTOM: "A COMMON SENSE LEADER FOR ALL OF PROSPER" ====== -->
  <g>
    <!-- Red ribbon banner -->
    <path d="M80,385 L720,385 L740,415 L720,445 L80,445 L60,415 Z" fill="url(#redGrad)"/>
    <!-- Banner fold shadows -->
    <path d="M80,385 L60,415 L80,445 L90,415 Z" fill="#9F1020" opacity="0.5"/>
    <path d="M720,385 L740,415 L720,445 L710,415 Z" fill="#9F1020" opacity="0.5"/>
    <text x="400" y="422" text-anchor="middle" font-family="'Oswald', 'Arial Narrow', sans-serif" font-size="28" font-weight="700" fill="white" letter-spacing="3">A COMMON SENSE LEADER</text>
    <text x="400" y="442" text-anchor="middle" font-family="'Oswald', 'Arial Narrow', sans-serif" font-size="18" font-weight="600" fill="white" letter-spacing="2" opacity="0.95">FOR ALL OF PROSPER</text>
  </g>

  <!-- ====== DECORATIVE STARS BELOW ====== -->
  <g fill="#1B3A5D">
    <polygon points="370,465 372,459 374,465 380,465 375,469 377,475 372,471 367,475 369,469 364,465" opacity="0.7"/>
    <polygon points="396,462 399,454 402,462 410,462 404,467 406,475 399,470 392,475 394,467 388,462"/>
    <polygon points="424,465 426,459 428,465 434,465 429,469 431,475 426,471 421,475 423,469 418,465" opacity="0.7"/>
  </g>

  <!-- ====== SUBTLE NAVY/RED GRADIENT LINE AT VERY BOTTOM ====== -->
  <rect x="200" y="490" width="400" height="3" rx="1.5" fill="url(#navyGrad)" opacity="0.3"/>
</svg>
